name: Windows

# Tag pushes do NOT trigger this file: release.yml owns the tag and calls
# this workflow through `workflow_call`, so one tag means one run of every
# job here rather than two.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSYS2 UCRT64 x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          # Pinned: bump alongside the nevermore commit that consumes a
          # new boba API or behavior (currently the keyboard protocol:
          # TuiKeyboardEnhancements carries the flag set, the inline
          # render mode reconciles it, Ctrl+C/Ctrl+D keep their
          # INTERRUPT/EOF verdicts under the protocol, the probe
          # answers CSI ? u with TuiTerminalProfile::kbd_protocol — the
          # `kbd` key's `auto` tier is that answer — and the parser
          # decodes the associated text into TuiKeyMsg::text, without
          # which the declared report-all flag would turn every capital
          # into its unshifted key code — and the parser DROPS a
          # functional key (the modifier keys themselves, which that
          # flag reports, plus the lock, media, keypad and F13+ keys)
          # instead of handing its Private-Use-Area codepoint to the
          # input as a rune, which is what typed an invisible
          # character every time the user pressed Shift — and decodes
          # the modifier field as the BIT FIELD it is (the lock bits
          # masked off, since the report-all flag puts them on every
          # key: with Num Lock on, a table of exact values read
          # Shift+Enter as a bare Enter); plus the
          # textinput's own bracketed-paste insert — the app hands the
          # input TUI_MSG_PASTE and no longer synthesizes a key per
          # codepoint, so a pasted newline is one edit with one undo
          # entry — plus the status line component —
          # components/statusline.h's TuiStatusLine + TuiSegment, which
          # the app DECLARES and boba lays out, replacing the text
          # input's status line: TuiSpan and
          # tui_textinput_set_status_line are gone, and the input no
          # longer counts a chrome row — plus the list popup's metadata
          # column — tui_list_popup_set_items_meta / set_meta_color, the
          # model picker's capability badges + context window — and the
          # earlier APIs this repo already depends on: the image tier's
          # kitty transport (a=T with s/v, without which an IMAGE unit
          # reserves its rows and places nothing) and its sixel
          # transport (TUI_IMAGE_SIXEL + TUI_IMAGE_INDEXED8, the spec's
          # DCS framed from the app's quantized payload, whose row
          # closes WITHOUT a terminator — the terminal lands the cursor
          # below the picture, so a break would leave a blank line under
          # it), the explicit image
          # unit message
          # (tui_msg_stream_image), the display-column metrics fix that
          # lands the cursor on the right cell when a prompt is two
          # cells wide, the inline-frame reflow-erase fix so a terminal
          # resize no longer strands the frame's top rows, and the
          # Windows stdin-reader teardown fix this repo's Windows loop
          # inherits — plus the terminal profile's env-derived
          # truecolor hint (TuiTerminalProfile::truecolor, readable
          # before the probe resolves: COLORTERM and the
          # direct-color TERM variants), which the spinner's color
          # tier reads — and, at this pin, the container-boundary fix:
          # a container's OPEN/CLOSE verdict finalizes a live
          # block-granular block, so a table or an image followed by a
          # fence line commits BEFORE the fence instead of after it and
          # never takes the fence's bytes into its own cells, which is
          # what lets nevermore keep the model's blank lines inside a
          # block and still end the block where the next one starts).
          # And, at this pin, the inline paint protocol: a paint is
          # delivered in ONE write, and cursor visibility is
          # edge-triggered — a change emits its one mode byte, a steady
          # cursor emits none — so a frame no longer carries a
          # hide/show-cursor pair. The chat-app tests replay the
          # capture as a screen and read the committed scrollback above
          # the live region.
          # And, at this pin, the image row framing: a sixel or an
          # iTerm2 image closes its row WITHOUT a terminator (the
          # terminal lands the cursor below the picture, so a break
          # would leave a blank line under it); kitty still reserves
          # the image's rows.
          # A floating master would let boba churn break this repo's CI
          # mid-work. NOTE: this tag must exist on the boba remote
          # BEFORE nevermore, or CI cannot fetch it. It also names the
          # version the packaged binaries print (git describe reads
          # v0.5.1; nevermore reports boba 0.5.1). Bump it in all three
          # platform workflows at once.
          ref: v0.5.1
          path: boba
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: false
          install: >-
            make
            autoconf
            automake
            libtool
            git
            mingw-w64-ucrt-x86_64-toolchain
            pkg-config
            zip
            unzip

      - name: Build and install boba
        # No cache: a restored boba install is a compiled artifact whose
        # version string was baked by ITS configure, from the tags visible
        # then — so a hit could hand this job a boba older than the pin
        # names, silently (v0.2.0 shipped exactly that: a Windows .exe
        # reading `boba 0.3.0.5-7d0101b` beside a macOS ZIP from the same
        # run reading `boba 0.4.0`). The rebuild costs ~26 s of a ~6 min
        # job; linux.yml and macos.yml have always paid it (6-15 s) and
        # cannot drift for the same reason.
        run: |
          cd boba
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j && make install

      - name: Build (Schannel TLS — native, no deps)
        run: |
          # setup-msys2 does not pass PKG_CONFIG_PATH through to the
          # MSYS2 environment (msys2/setup-msys2#98), and /etc/profile
          # overwrites it on every login shell; export it here so
          # pkgconf finds the boba.pc built just above. $HOME/.local is a
          # POSIX path (no drive letter) — a C:/... path here would split
          # on the drive-letter colon and pkg-config would see two bogus
          # dirs.
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j
          # Pre-build the test binaries in parallel HERE, so `make check`
          # below does not compile ~28 of them SERIALly inside the timed
          # test step — the same lesson macos.yml already applies. The
          # measured cost was ~3.5 min of serial CC passes; this folds
          # them into the parallel build. (check_PROGRAMS is a tests/
          # subdir target — the root `make -j` above does not descend.)
          make -j"$(nproc)" -C tests check-programs

      - name: Run tests
        # Backstop: the per-test watchdog fires first; this bounds
        # the whole step so no hang can burn the job budget.
        timeout-minutes: 20
        run: make -C build check

      - name: Build portable ZIP
        # The shipped .exe is NOT the tested one, on purpose: --enable-release
        # is the -O3 build with no sanitizer, and a .exe that needs a
        # sanitizer runtime the user's machine does not have is not portable.
        # Second out-of-tree build dir, src only — the ZIP carries one exe
        # plus whatever DLLs Windows does not ship.
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$PKG_CONFIG_PATH"
          mkdir build-rel && cd build-rel
          ../configure --enable-release
          make -j"$(nproc)" -C src
          make dist-portable

      - name: Verify extracted portable ZIP
        run: |
          set -eu
          archives=(build-rel/nevermore-*-windows-*.zip)
          test "${#archives[@]}" -eq 1 && test -f "${archives[0]}" || {
            echo "ERROR: expected exactly one Windows ZIP, found: ${archives[*]}" >&2
            exit 1
          }
          archive="${archives[0]}"
          package_dir=$(mktemp -d)
          unzip -q "$archive" -d "$package_dir"

          # The archive name IS the version: nevermore-<ver>-windows-<arch>.zip.
          version=$(basename "$archive" | sed 's/^nevermore-//; s/-windows-.*$//')
          stage=("$package_dir"/nevermore-"$version"-windows-*)
          test -d "$stage" || {
            echo "ERROR: the ZIP does not hold a nevermore-$version-windows-* folder:" >&2
            find "$package_dir" -maxdepth 2 >&2
            exit 1
          }
          exe="$stage/nevermore.exe"
          for file in "$exe" "$stage/README.md" "$stage/COPYING" \
              "$stage/README-PORTABLE.txt"; do
            test -f "$file" || { echo "ERROR: $file missing from the ZIP" >&2; exit 1; }
          done
          echo "  the bundle:"
          ls -l "$stage" | sed 's/^/    /'

          # Windows resolves an executable's imports from its own directory
          # first, so a PATH holding nothing but System32 proves the bundle is
          # self-contained: whatever it does not provide has to come from
          # Windows. System32 has its own timeout.exe, so name the coreutils
          # one outright.
          timeout_bin=$(command -v timeout)
          test -n "$timeout_bin"
          system32="$(cygpath -u "${SYSTEMROOT:-C:\\Windows}")/System32"
          if ! out=$(cd "$stage" && PATH="$system32" "$timeout_bin" 60 "$exe" --version); then
            echo "ERROR: the packaged nevermore.exe did not start with only $system32 on PATH" >&2
            exit 1
          fi
          echo "  $out"
          # The pin is the claim, the binary is the evidence — and the
          # boba half of the line is the half that lies when the install
          # came from anywhere but this checkout. boba bakes its version
          # in at ITS configure time, from the tags it can see, with the
          # rule in its own build-aux/git-version.sh (strip the `v`,
          # `-<n>-g<sha>` becomes `.<n>-<sha>`, `-dirty` on a dirty tree):
          # reproduce that rule and require the packaged .exe to agree.
          expected_boba=$(git -C boba describe --tags --match 'v*' |
            sed 's/^v//;s/-\([0-9]*\)-g/.\1-/')
          printf '%s\n' "$out" | grep -q "nevermore $version (boba $expected_boba; " || {
            echo "ERROR: named $version, but the .exe reports '$out' —" >&2
            echo "       this checkout builds '(boba $expected_boba)'" >&2
            exit 1
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: nevermore-windows-x86_64
          path: build-rel/nevermore-*-windows-*.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-windows
          path: |
            build/tests/*.log
            build/tests/*/*.log
            build/tests/test-progress.log
            build/tests/core*
            core*
          retention-days: 7
          if-no-files-found: warn
