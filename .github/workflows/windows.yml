name: Windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSYS2 UCRT64 x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          # Pinned: bump alongside the nevermore commit that consumes a
          # new boba API (currently the input's status line —
          # components/textinput.h's TuiSpan +
          # tui_textinput_set_status_line, nevermore's spinner/context
          # gauge/separator rule — plus the display-column metrics fix
          # that lands the cursor on the right cell when a prompt is two
          # cells wide, the inline-frame reflow-erase fix so a terminal
          # resize no longer strands the frame's top rows, and the
          # Windows stdin-reader teardown fix this repo's Windows loop
          # inherits).
          # A floating master would let boba churn break this repo's CI
          # mid-work. NOTE: this SHA must be PUSHED to the boba remote
          # BEFORE nevermore, or CI cannot fetch it.
          ref: f12750a8a9024392fc2e7b88b6a060f71c647a5c
          path: boba
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: false
          install: >-
            make
            autoconf
            automake
            libtool
            git
            mingw-w64-ucrt-x86_64-toolchain
            pkg-config

      - name: Build and install boba
        run: |
          cd boba
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j && make install

      - name: Build (Schannel TLS — native, no deps)
        run: |
          # setup-msys2 does not pass PKG_CONFIG_PATH through to the
          # MSYS2 environment (msys2/setup-msys2#98), and /etc/profile
          # overwrites it on every login shell; export it here so
          # pkgconf finds the boba.pc we just installed.
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j

      - name: Run tests
        # Backstop: the per-test watchdog fires first; this bounds
        # the whole step so no hang can burn the job budget.
        timeout-minutes: 20
        run: make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-windows
          path: |
            build/tests/*.log
            build/tests/test-progress.log
            build/tests/core*
            core*
          retention-days: 7
          if-no-files-found: warn
