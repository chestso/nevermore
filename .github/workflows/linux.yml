name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  linux:
    name: GNU/Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          # Pinned: bump alongside the nevermore commit that consumes a
          # new boba API (currently the I/O-source subscription seam —
          # runtime.h's TUI_SRC_*/fill_io_sources/on_io_ready, which
          # replaced the fd-only fill_external_fds/on_external_ready).
          # A floating master would let boba churn break this repo's CI
          # mid-work. NOTE: this SHA must be PUSHED to the boba remote
          # BEFORE nevermore, or CI cannot fetch it.
          ref: 9c49c40c157e6e09a62f14ab6a7a38f2acda2c49
          path: boba
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config \
            libmbedtls-dev

      - name: Build and install boba
        run: |
          cd boba
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j"$(nproc)" && make install

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$HOME/.local/lib64/pkgconfig"
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j"$(nproc)"

      - name: Run tests
        # Backstop: the per-test watchdog fires first; this bounds
        # the whole step so no hang can burn the job budget.
        timeout-minutes: 20
        run: make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-linux
          path: |
            build/tests/*.log
            build/tests/test-progress.log
            build/tests/core*
            core*
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build release tarball
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-release
          make dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/nevermore-*.tar.gz
