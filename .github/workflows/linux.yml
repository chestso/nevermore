name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  linux:
    name: GNU/Linux (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both Linux TLS backends are compiled AND tested — an explicit
        # --with-tls per job, so neither depends on distro-version luck.
        # mbedTLS auto-detect would pick Ubuntu's 2.28 (the widened
        # floor), which would leave tls_openssl.c dead; openssl would
        # leave tls_mbedtls.c dead. Two jobs close both blind spots.
        backend: [openssl, mbedtls]

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          # Pinned: bump alongside the nevermore commit that consumes a
          # new boba API (currently the input's status line —
          # components/textinput.h's TuiSpan +
          # tui_textinput_set_status_line, nevermore's spinner/context
          # gauge/separator rule — plus the display-column metrics fix
          # that lands the cursor on the right cell when a prompt is two
          # cells wide, the inline-frame reflow-erase fix so a terminal
          # resize no longer strands the frame's top rows, and the
          # Windows stdin-reader teardown fix this repo's Windows loop
          # inherits).
          # A floating master would let boba churn break this repo's CI
          # mid-work. NOTE: this SHA must be PUSHED to the boba remote
          # BEFORE nevermore, or CI cannot fetch it.
          ref: d0d641f7ae0e000ad08b0cfb7130e24b2d4d9612
          path: boba
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config
          # The backend each job is pinned to (never auto-detect's pick).
          if [ "${{ matrix.backend }}" = "mbedtls" ]; then
            sudo apt-get install -y libmbedtls-dev
          else
            sudo apt-get install -y libssl-dev
          fi

      - name: Build and install boba
        run: |
          cd boba
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j"$(nproc)" && make install

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$HOME/.local/lib64/pkgconfig"
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local" --with-tls=${{ matrix.backend }}
          make -j"$(nproc)"

      - name: Run tests
        # Backstop: the per-test watchdog fires first; this bounds
        # the whole step so no hang can burn the job budget.
        timeout-minutes: 20
        run: make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-linux-${{ matrix.backend }}
          path: |
            build/tests/*.log
            build/tests/test-progress.log
            build/tests/core*
            core*
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build release tarball
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-release
          make dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/nevermore-*.tar.gz
