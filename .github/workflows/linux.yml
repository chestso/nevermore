name: GNU/Linux

# Tag pushes do NOT trigger this file: release.yml owns the tag and calls
# this workflow through `workflow_call`, so one tag means one run of every
# job here rather than two.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: write

jobs:
  linux:
    name: GNU/Linux (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both Linux TLS backends are compiled AND tested — an explicit
        # --with-tls per job, so neither depends on distro-version luck.
        # mbedTLS auto-detect would pick Ubuntu's 2.28 (the widened
        # floor), which would leave tls_openssl.c dead; openssl would
        # leave tls_mbedtls.c dead. Two jobs close both blind spots.
        backend: [openssl, mbedtls]

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          # Pinned: bump alongside the nevermore commit that consumes a
          # new boba API or behavior (currently the keyboard protocol:
          # TuiKeyboardEnhancements carries the flag set, the inline
          # render mode reconciles it, Ctrl+C/Ctrl+D keep their
          # INTERRUPT/EOF verdicts under the protocol, the probe
          # answers CSI ? u with TuiTerminalProfile::kbd_protocol — the
          # `kbd` key's `auto` tier is that answer — and the parser
          # decodes the associated text into TuiKeyMsg::text, without
          # which the declared report-all flag would turn every capital
          # into its unshifted key code — and the parser DROPS a
          # functional key (the modifier keys themselves, which that
          # flag reports, plus the lock, media, keypad and F13+ keys)
          # instead of handing its Private-Use-Area codepoint to the
          # input as a rune, which is what typed an invisible
          # character every time the user pressed Shift — and decodes
          # the modifier field as the BIT FIELD it is (the lock bits
          # masked off, since the report-all flag puts them on every
          # key: with Num Lock on, a table of exact values read
          # Shift+Enter as a bare Enter); plus the
          # textinput's own bracketed-paste insert — the app hands the
          # input TUI_MSG_PASTE and no longer synthesizes a key per
          # codepoint, so a pasted newline is one edit with one undo
          # entry — plus the status line component —
          # components/statusline.h's TuiStatusLine + TuiSegment, which
          # the app DECLARES and boba lays out, replacing the text
          # input's status line: TuiSpan and
          # tui_textinput_set_status_line are gone, and the input no
          # longer counts a chrome row — plus the list popup's metadata
          # column — tui_list_popup_set_items_meta / set_meta_color, the
          # model picker's capability badges + context window — and the
          # earlier APIs this repo already depends on: the image tier's
          # kitty transport (a=T with s/v, without which an IMAGE unit
          # reserves its rows and places nothing) and its sixel
          # transport (TUI_IMAGE_SIXEL + TUI_IMAGE_INDEXED8, the spec's
          # DCS framed from the app's quantized payload, whose row
          # closes WITHOUT a terminator — the terminal lands the cursor
          # below the picture, so a break would leave a blank line under
          # it), the explicit image
          # unit message (tui_msg_stream_image), the display-column
          # metrics fix that lands the cursor on the right cell when a
          # prompt is two cells wide, the inline-frame reflow-erase fix
          # so a terminal resize no longer strands the frame's top rows,
          # and the Windows stdin-reader teardown fix this repo's
          # Windows loop inherits — plus the terminal profile's
          # env-derived truecolor hint
          # (TuiTerminalProfile::truecolor, readable before the
          # probe resolves: COLORTERM and the direct-color TERM
          # variants), which the spinner's color tier reads — and, at
          # this pin, the container-boundary fix: a container's
          # OPEN/CLOSE verdict finalizes a live block-granular block, so
          # a table or an image followed by a fence line commits BEFORE
          # the fence instead of after it and never takes the fence's
          # bytes into its own cells, which is what lets nevermore keep
          # the model's blank lines inside a block and still end the
          # block where the next one starts — and, at this pin, the
          # verdict contract STATES what CONTINUES extends: a kind that
          # owns one line (an ATX heading, a standalone image) has to be
          # ended from the classifier side, which is nevermore's
          # one-line rule, and the explicit image route gets the same
          # boundary by resetting `prev`).
          # And, at this pin, the inline paint protocol: a paint is
          # delivered in ONE write, and cursor visibility is
          # edge-triggered — a change emits its one mode byte, a steady
          # cursor emits none — so a frame no longer carries a
          # hide/show-cursor pair. The chat-app tests replay the
          # capture as a screen and read the committed scrollback above
          # the live region.
          # And, at this pin, the image row framing: a sixel or an
          # iTerm2 image closes its row WITHOUT a terminator (the
          # terminal lands the cursor below the picture, so a break
          # would leave a blank line under it); kitty still reserves
          # the image's rows.
          # And, at this pin, the width model's resolution: TERM decides
          # before the identity markers, so the INNERMOST terminal owns
          # the grid (an xterm inside portty measures with the grid rule,
          # not portty's) — the rule the startup banner names, and the
          # one the status row's columns are measured with.
          # A floating master would let boba churn break this repo's CI
          # mid-work. NOTE: this tag must exist on the boba remote
          # BEFORE nevermore, or CI cannot fetch it. It also names the
          # version the packaged binaries print (git describe reads
          # v0.5.2; nevermore reports boba 0.5.2). Bump it in all three
          # platform workflows at once.
          ref: v0.5.2
          path: boba
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config
          # The backend each job is pinned to (never auto-detect's pick).
          if [ "${{ matrix.backend }}" = "mbedtls" ]; then
            sudo apt-get install -y libmbedtls-dev
          else
            sudo apt-get install -y libssl-dev
          fi

      - name: Build and install boba
        run: |
          cd boba
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j"$(nproc)" && make install

      - name: Checkout coffer (cfr-debug, the E2E PTY inspector)
        uses: actions/checkout@v5
        with:
          repository: chestso/coffer
          # Pinned: tests/e2e_portty drives the BUILT binary through
          # coffer's cfr-debug, so a coffer change to the script
          # vocabulary or the grid/scrollback queries can break this
          # repo's e2e. The vocabulary the harness needs (wait-for,
          # await-exit/assert-exit, the unified-buffer search) landed in
          # this commit. The same SHA lives in macos.yml; Windows does
          # not build coffer yet (its e2e reports SKIP). The coffer
          # commit must be PUSHED before nevermore, or CI cannot fetch
          # it.
          ref: 31dfa4904fa49780feda7e340a32e64340157ff2
          path: coffer
          fetch-depth: 0

      - name: Build and install coffer (cfr-debug)
        run: |
          cd coffer
          ./autogen.sh
          mkdir build && cd build
          # --enable-release: cfr-debug is the harness, not the subject
          # under test; coffer's default ASan+UBSan build would only add
          # startup cost and sanitizer noise to the e2e.
          ../configure --prefix="$HOME/.local" --enable-release
          make -j"$(nproc)" && make install

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$HOME/.local/lib64/pkgconfig"
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local" --with-tls=${{ matrix.backend }}
          make -j"$(nproc)"

      - name: Run tests
        # Backstop: the per-test watchdog fires first; this bounds
        # the whole step so no hang can burn the job budget.
        timeout-minutes: 20
        run: |
          # cfr-debug, installed above, is what tests/e2e_portty
          # drives; without it on PATH that test SKIPs (77).
          export PATH="$HOME/.local/bin:$PATH"
          make -C build check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-linux-${{ matrix.backend }}
          path: |
            build/tests/*.log
            build/tests/*/*.log
            build/tests/test-progress.log
            build/tests/core*
            core*
          retention-days: 7
          if-no-files-found: warn

  dist:
    name: Source tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          # The same pin as the linux job above (keep them together):
          # configure resolves boba through pkg-config, and a missing
          # boba.pc is a hard error, so a tarball job cannot skip the
          # dependency it does not compile.
          ref: v0.5.2
          path: boba
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make pkg-config

      - name: Build and install boba
        run: |
          cd boba
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j"$(nproc)" && make install

      - name: Create distribution tarball
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$HOME/.local/lib64/pkgconfig"
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make dist

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: nevermore-source-tarball
          path: build/nevermore-*.tar.gz
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}
