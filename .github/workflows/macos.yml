name: macOS

# Tag pushes do NOT trigger this file: release.yml owns the tag and calls
# this workflow through `workflow_call`, so one tag means one run of every
# job here rather than two.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          # Pinned: bump alongside the nevermore commit that consumes a
          # new boba API or behavior (currently the keyboard protocol:
          # TuiKeyboardEnhancements carries the flag set, the inline
          # render mode reconciles it, Ctrl+C/Ctrl+D keep their
          # INTERRUPT/EOF verdicts under the protocol, the probe
          # answers CSI ? u with TuiTerminalProfile::kbd_protocol — the
          # `kbd` key's `auto` tier is that answer — and the parser
          # decodes the associated text into TuiKeyMsg::text, without
          # which the declared report-all flag would turn every capital
          # into its unshifted key code — and the parser DROPS a
          # functional key (the modifier keys themselves, which that
          # flag reports, plus the lock, media, keypad and F13+ keys)
          # instead of handing its Private-Use-Area codepoint to the
          # input as a rune, which is what typed an invisible
          # character every time the user pressed Shift — and decodes
          # the modifier field as the BIT FIELD it is (the lock bits
          # masked off, since the report-all flag puts them on every
          # key: with Num Lock on, a table of exact values read
          # Shift+Enter as a bare Enter); plus the
          # textinput's own bracketed-paste insert — the app hands the
          # input TUI_MSG_PASTE and no longer synthesizes a key per
          # codepoint, so a pasted newline is one edit with one undo
          # entry — plus the status line component —
          # components/statusline.h's TuiStatusLine + TuiSegment, which
          # the app DECLARES and boba lays out, replacing the text
          # input's status line: TuiSpan and
          # tui_textinput_set_status_line are gone, and the input no
          # longer counts a chrome row — plus the list popup's metadata
          # column — tui_list_popup_set_items_meta / set_meta_color, the
          # model picker's capability badges + context window — and the
          # earlier APIs this repo already depends on: the image tier's
          # kitty transport (a=T with s/v, without which an IMAGE unit
          # reserves its rows and places nothing) and its sixel
          # transport (TUI_IMAGE_SIXEL + TUI_IMAGE_INDEXED8, the spec's
          # DCS framed from the app's quantized payload, which reserves
          # ONE row — the terminal lands the cursor on the image's last
          # row), the explicit image
          # unit message
          # (tui_msg_stream_image), the display-column metrics fix that
          # lands the cursor on the right cell when a prompt is two
          # cells wide, the inline-frame reflow-erase fix so a terminal
          # resize no longer strands the frame's top rows, and the
          # Windows stdin-reader teardown fix this repo's Windows loop
          # inherits — plus the terminal profile's env-derived
          # truecolor hint (TuiTerminalProfile::truecolor, readable
          # before the probe resolves: COLORTERM and the
          # direct-color TERM variants), which the spinner's color
          # tier reads — and, at this pin, the container-boundary fix:
          # a container's OPEN/CLOSE verdict finalizes a live
          # block-granular block, so a table or an image followed by a
          # fence line commits BEFORE the fence instead of after it and
          # never takes the fence's bytes into its own cells, which is
          # what lets nevermore keep the model's blank lines inside a
          # block and still end the block where the next one starts —
          # and, at this pin, the verdict contract STATES what CONTINUES
          # extends: a kind that owns one line (an ATX heading, a
          # standalone image) has to be ended from the classifier side,
          # which is nevermore's one-line rule, and the explicit image
          # route gets the same boundary by resetting `prev`).
          # A floating master would let boba churn break this repo's CI
          # mid-work. NOTE: this SHA must be PUSHED to the boba remote
          # BEFORE nevermore, or CI cannot fetch it.
          ref: 7d0101b882646df66af7e0d2976f869832d3cc27
          path: boba
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Build and install boba
        run: |
          cd boba
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Checkout coffer (cfr-debug, the E2E PTY inspector)
        uses: actions/checkout@v5
        with:
          repository: chestso/coffer
          # Pinned: tests/e2e_portty drives the BUILT binary through
          # coffer's cfr-debug, so a coffer change to the script
          # vocabulary or the grid/scrollback queries can break this
          # repo's e2e. The vocabulary the harness needs (wait-for,
          # await-exit/assert-exit, the unified-buffer search) landed in
          # this commit. The same SHA lives in linux.yml; Windows does
          # not build coffer yet (its e2e reports SKIP). The coffer
          # commit must be PUSHED before nevermore, or CI cannot fetch
          # it.
          ref: 31dfa4904fa49780feda7e340a32e64340157ff2
          path: coffer
          fetch-depth: 0

      - name: Build and install coffer (cfr-debug)
        run: |
          cd coffer
          ./autogen.sh
          mkdir build && cd build
          # --enable-release: cfr-debug is the harness, not the subject
          # under test; coffer's default ASan+UBSan build would only add
          # startup cost and sanitizer noise to the e2e.
          ../configure --prefix="$HOME/.local" --enable-release
          make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Build (Secure Transport TLS — native, no deps)
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig"
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          # Build everything INCLUDING the test binaries here, in
          # parallel. `make check` would otherwise compile all 13
          # test binaries serially inside the timed test step —
          # serial compile time was a big chunk of the mysterious
          # macOS "Run tests" stalls (it was never only the tests).
          # (check_PROGRAMS is a tests/ subdir target — no such
          # rule at the build root.)
          make -j"$(sysctl -n hw.ncpu)" -C tests check-programs
          # src too: the E2E harness drives the built BINARY, and
          # check-programs never builds it. Still outside the timed
          # step, still parallel.
          make -j"$(sysctl -n hw.ncpu)" -C src

      - name: Run tests
        # Hard cap: one hung step can never again burn the 4h job
        # budget. The per-test watchdog should fire first (a FAIL
        # with a stack in the .log); this is the backstop. 20m
        # covers the serial check_PROGRAMS rebuild automake does
        # plus the parallel test run with generous slack.
        timeout-minutes: 20
        run: |
          # Cores where the watchdog's kill can drop them (macOS:
          # /cores is the writable core dir on the runner).
          ulimit -c unlimited 2>/dev/null || true
          # cfr-debug, installed above, is what tests/e2e_portty
          # drives; without it on PATH that test SKIPs (77).
          export PATH="$HOME/.local/bin:$PATH"
          make -C build check

      - name: Build portable ZIP
        # The shipped binary is NOT the tested one, on purpose: the tested
        # tree is the sanitized build (ASan+UBSan by default), and a binary
        # that needs a sanitizer runtime the user's machine does not have is
        # not portable. Second out-of-tree build dir, release mode, src
        # only — the ZIP carries one file.
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig"
          mkdir build-rel && cd build-rel
          ../configure --enable-release
          make -j"$(sysctl -n hw.ncpu)" -C src
          make dist-portable

      - name: Verify extracted portable ZIP
        run: |
          set -eu
          archives=(build-rel/nevermore-*-macos-*.zip)
          test "${#archives[@]}" -eq 1 && test -f "${archives[0]}" || {
            echo "ERROR: expected exactly one macOS ZIP, found: ${archives[*]}" >&2
            exit 1
          }
          archive="${archives[0]}"
          package_dir=$(mktemp -d "$RUNNER_TEMP/nm-zip.XXXXXX")
          ditto -x -k "$archive" "$package_dir"

          # The archive name IS the version: nevermore-<ver>-macos-<arch>.zip.
          version=$(basename "$archive" | sed 's/^nevermore-//; s/-macos-.*$//')
          stage=("$package_dir"/nevermore-"$version"-macos-*)
          test -d "$stage" || {
            echo "ERROR: the ZIP does not hold a nevermore-$version-macos-* folder:" >&2
            find "$package_dir" -maxdepth 2 >&2
            exit 1
          }
          bin="$stage/nevermore"
          for file in "$bin" "$stage/README.md" "$stage/COPYING" \
              "$stage/README-PORTABLE.txt"; do
            test -f "$file" || { echo "ERROR: $file missing from the ZIP" >&2; exit 1; }
          done

          # Every load command must be a system one — the same rule the
          # packing script applies, checked on the bytes that actually
          # shipped rather than on the ones it started from.
          otool -l "$bin" |
            awk '$1 == "cmd" {
                   want = ($2 ~ /^LC_(LOAD|LOAD_WEAK|REEXPORT|LOAD_UPWARD|LAZY_LOAD)_DYLIB$/)
                 }
                 want && $1 == "name" {
                   sub(/^[[:space:]]*name /, ""); sub(/ \(offset [0-9]+\)$/, "")
                   print
                   want = 0
                 }' >"$package_dir/deps.txt"
          if grep -qvE '^(/usr/lib|/System/Library)' "$package_dir/deps.txt"; then
            echo "ERROR: the shipped binary links a non-system library:" >&2
            cat "$package_dir/deps.txt" >&2
            exit 1
          fi
          echo "  links only system libraries:"
          sed 's/^/    /' "$package_dir/deps.txt"

          # The linker's ad-hoc signature has to survive the ZIP, and the
          # version the binary prints has to be the version it is named for.
          codesign --verify --strict "$bin"
          out=$("$bin" --version)
          echo "  $out"
          printf '%s\n' "$out" | grep -q "nevermore $version" || {
            echo "ERROR: named $version, reports something else" >&2
            exit 1
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: nevermore-macos-arm64
          path: build-rel/nevermore-*-macos-*.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-macos
          path: |
            build/tests/*.log
            build/tests/*/*.log
            build/tests/test-progress.log
            build/tests/core*
            core*
            /cores/*
          retention-days: 7
          if-no-files-found: warn
