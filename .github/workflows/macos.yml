name: macOS

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout nevermore
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          path: boba
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Build and install boba
        run: |
          cd boba
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Build (Secure Transport TLS — native, no deps)
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig"
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$HOME/.local"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Run tests
        run: make -C build check

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: build/tests/*.log
          retention-days: 7
          if-no-files-found: warn
